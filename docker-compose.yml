version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PORT=3001
    volumes:
      - ./data:/app/data
    command: node server.js

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend